<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Niet Gevonden - BitBeheer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 2rem;
        }
        h1 {
            color: #f97316;
            font-size: 4rem;
            margin: 0;
        }
        h2 {
            color: #374151;
            margin: 1rem 0;
        }
        p {
            color: #6b7280;
            margin: 1rem 0;
        }
        .button {
            display: inline-block;
            background: #f97316;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin: 1rem 0.5rem;
            transition: background 0.3s;
        }
        .button:hover {
            background: #ea580c;
        }
        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #f97316;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">BitBeheer</div>
        <h1>404</h1>
        <h2>Pagina Niet Gevonden</h2>
        <p>De pagina die je zoekt bestaat niet of is verplaatst.</p>
        <p>Ga terug naar de hoofdpagina of probeer een andere link.</p>
        <a href="/" class="button">Terug naar Home</a>
        <a href="/aanmelden" class="button">Aanmelden</a>
    </div>
    <script>
        // Redirect to home page after 5 seconds
        setTimeout(() => {
            window.location.href = '/';
        }, 5000);
    </script>
</body>
</html>
